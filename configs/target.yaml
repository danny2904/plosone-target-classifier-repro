# Target-identification conditions — Table 7 settings
max_len: 192
epochs: 10
batch_size: 16
learning_rate: 2.0e-5
weight_decay: 0.01
early_stop_patience: 3
early_stop_min_delta: 0.0
use_class_weights: 1

conditions:
  B1: data/vihos_target_fulltext.jsonl          # sentence only
  B2: data/vihos_target_highlighted.jsonl       # gold spans marked
  B3: data/vihos_target_highlighted_pred.jsonl  # predicted spans marked (test split)

backbones:
  xlm-roberta-base:       {seeds: [201, 202, 203, 204, 205, 206]}
  vinai/phobert-base-v2:  {seeds: [42, 43, 44, 45, 46, 47]}
  vinai/bartpho-word:     {seeds: [42, 43, 44, 45, 46, 47]}
  uitnlp/visobert:        {seeds: [42, 43, 44, 45, 46]}
